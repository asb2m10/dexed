name: dexed-pipeline

on:
  push:
    branches:
      - master
    tags:
      - '*'

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  component_version:
    name: "Set up version"
    runs-on: ubuntu-22.04
    outputs:
      build_version: ${{ steps.vers.outputs.build_version }}
      build_type : ${{ steps.vers.outputs.build_type }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Calculate version"
        id: vers
        run: |
          ref=${{ github.ref }}

          echo "## Creating version from '${ref}'" >> $GITHUB_STEP_SUMMARY

          if [ "$GITHUB_REF_TYPE" == "tag" ]; then
            echo "Generating Release Version" >> $GITHUB_STEP_SUMMARY
            export BUILD_VERSION=${GITHUB_REF_NAME:1}
          else
            echo "Generating Merge Version" >> $GITHUB_STEP_SUMMARY
            export BUILD_VERSION="$(date +%Y-%m-%d)-$(git rev-parse --short HEAD)"
          fi

          # Optional custom marker so this build is identifiable as a fork/custom build
          if [ -n "${{ vars.CUSTOM_BUILD_ID }}" ]; then
            export BUILD_VERSION="${BUILD_VERSION}-${{ vars.CUSTOM_BUILD_ID }}"
          fi

          export BUILD_TYPE=Release

          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-latest
    name: "Linux x86_64 Build"
    environment: default
    needs: [ component_version ]

    steps:
    - uses: awalsh128/cache-apt-pkgs-action@latest
      if: runner.os == 'linux'
      with:
        packages: libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev ccache xvfb libjack-dev libsndfile-dev

    - uses: actions/checkout@v4
      with:
         submodules: recursive

    - name: Build
      run: |
        cmake -S . -B ./build -DCMAKE_BUILD_TYPE=${{ needs.component_version.outputs.build_type }} -DBUILD_ID=${{ needs.component_version.outputs.build_version }} -DDEXED_SKIP_STANDALONE=ON -DDEXED_SKIP_CLAP=ON -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
        cmake --build ./build --config ${{ needs.component_version.outputs.build_type }} --target installer --parallel 3

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: linux-bin
        path: |
          ${{github.workspace}}/build/installer/*

  build-linux-arm64:
    runs-on: [ self-hosted, linux, arm64 ]
    name: "Linux ARM64 Build"
    environment: default
    if: ${{ vars.BUILD_ARM64 == 'true' }}
    needs: [ component_version ]

    steps:
    - uses: awalsh128/cache-apt-pkgs-action@latest
      if: runner.os == 'linux'
      with:
        packages: libasound2-dev libx11-dev libxinerama-dev libxext-dev libfreetype6-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev ccache xvfb libjack-dev libsndfile-dev

    - uses: actions/checkout@v4
      with:
         submodules: recursive

    - name: Build
      run: |
        cmake -S . -B ./build -DCMAKE_BUILD_TYPE=${{ needs.component_version.outputs.build_type }} -DBUILD_ID=${{ needs.component_version.outputs.build_version }} -DDEXED_SKIP_STANDALONE=ON -DDEXED_SKIP_CLAP=ON -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
        cmake --build ./build --config ${{ needs.component_version.outputs.build_type }} --target installer --parallel 3

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-bin
        path: |
          ${{github.workspace}}/build/installer/*

  publish-latest:
    name: "Publish Latest"
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && !cancelled() && !contains(needs.*.result, 'failure')
    needs: [ build-linux, build-linux-arm64 ]
    steps:
      - name: "Upload to latest"
        uses: surge-synthesizer/sst-githubactions/upload-to-release@main
        with:
          tag: latest
          reuse_tag: true
          create_tag: true
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: "Publish Release"
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    needs: [ build-linux, build-linux-arm64 ]
    steps:
      - name: "Upload to release"
        uses: surge-synthesizer/sst-githubactions/upload-to-release@main
        with:
          tag: ${{ github.ref_name }}
          reuse_tag: false
          create_tag: true
          token: ${{ secrets.GITHUB_TOKEN }}